<style>
/* Layout: one-thumb phone app. Sticky header, scrolling view, bottom tab bar. Melee-HUD italic numerals for every percent. */
:root{
  --bg:#ECEDE2; --surface:#F9F9F2; --ink:#1F2414; --muted:#5E6450; --line:#D3D5BF;
  --accent:#55692B; --accent-ink:#F9F9F2; --gold:#9C7414;
  --red:#B5402F; --amber:#B7791F; --green:#2E8656; --chip:#E1E3CF;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14170D; --surface:#1D2114; --ink:#ECEBD9; --muted:#A3A68C; --line:#30351E;
  --accent:#A8BA62; --accent-ink:#14170D; --gold:#DDB548;
  --red:#EE7462; --amber:#F2B84B; --green:#5CC08A; --chip:#272C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14170D; --surface:#1D2114; --ink:#ECEBD9; --muted:#A3A68C; --line:#30351E;
  --accent:#A8BA62; --accent-ink:#14170D; --gold:#DDB548;
  --red:#EE7462; --amber:#F2B84B; --green:#5CC08A; --chip:#272C19; color-scheme:dark}
/* Mode palettes: Forest follows the system theme; Water is always deep ocean, Mist always pale sky */
html:root[data-mode="water"]{
  --bg:#0A1A2A; --surface:#10243A; --ink:#E4EEF7; --muted:#8FA6BD; --line:#1F3A55;
  --accent:#4FA3D9; --accent-ink:#0A1A2A; --gold:#7FD3DA;
  --red:#F07C6E; --amber:#F2B84B; --green:#5CC08A; --chip:#16304A; color-scheme:dark}
html:root[data-mode="mist"]{
  --bg:#E8F2FA; --surface:#F7FBFE; --ink:#16283A; --muted:#55708A; --line:#C8DBEA;
  --accent:#3A7FC0; --accent-ink:#F7FBFE; --gold:#2A6699;
  --red:#B5402F; --amber:#A86E14; --green:#2E8656; --chip:#D8E8F4; color-scheme:light}
body{transition:background-color .25s ease,color .25s ease}
@media (prefers-reduced-motion:reduce){body{transition:none}}
.brand{color:var(--gold)}
.pocket{border-color:var(--gold)!important}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;letter-spacing:.01em;line-height:1;flex:1;min-width:0}
.brand small{display:block;font-family:var(--mono);font-style:normal;font-weight:500;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mode{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 10px;font:600 13px var(--body);display:flex;align-items:center;gap:7px;cursor:pointer}
.mode i{width:10px;height:10px;border-radius:50%;background:var(--mc,var(--green))}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;color:var(--muted);padding:10px 2px 12px;font:600 11.5px var(--body);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
h3{font:600 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
p{margin:0}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
li::marker{color:var(--accent)}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:1 0 auto;text-align:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.theme-line{font-size:17px;line-height:1.45;font-weight:500}
.pct{font-family:var(--display);font-style:italic;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.split{grid-template-columns:1fr}}
.split>div{min-width:0}
.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--muted)}
.pocket{border:2px solid var(--accent);border-radius:14px;padding:14px 16px;background:var(--surface)}
.pocket ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:p}
.pocket li{counter-increment:p;display:flex;gap:10px;font-weight:500}
.pocket li::before{content:counter(p);font-family:var(--display);font-style:italic;font-weight:800;color:var(--accent);font-size:20px;line-height:1.1;min-width:14px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 18px var(--mono);color:var(--muted)}
details[open] summary::after{content:"–"}
details>div{padding-bottom:14px}
.kh{margin:14px 0 8px;color:var(--accent)}
details>div>.kh:first-child{margin-top:0}
.kl li{font-size:14.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:11px;padding:4px}
.seg button{border:0;background:none;color:var(--muted);border-radius:8px;padding:8px 4px;font:600 14px var(--body);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.seg button i{width:9px;height:9px;border-radius:50%;flex:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.quote{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25;color:var(--ink);border-left:3px solid var(--gold);padding-left:12px}
input,select,textarea{width:100%;font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;box-sizing:border-box}
textarea{min-height:72px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font:600 12px var(--body);color:var(--muted);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.btn{border:0;border-radius:10px;padding:11px 16px;font:600 15px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{padding:6px 10px;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{text-align:right}
.scroll{overflow-x:auto;margin-inline:-4px}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock{font-family:var(--display);font-style:italic;font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;min-width:150px}
.drill{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.drill:first-child{border-top:0}
.drill .t{flex:1;min-width:0}
.drill .t b{display:block}
.drill .m{text-align:right;flex:none}
.drill .m .pct{font-size:22px;color:var(--ink)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat3 .pct{font-size:30px;line-height:1;display:block;color:var(--ink)}
.stat3 small{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rate{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rate:first-child{border-top:0}
.rate span{flex:1;min-width:0}
.dot{flex:none;width:76px;border:0;border-radius:999px;padding:5px 0;font:600 12px var(--body);cursor:pointer;color:#fff}
.dot[data-r="red"]{background:var(--red)} .dot[data-r="yellow"]{background:var(--amber)} .dot[data-r="green"]{background:var(--green)} .dot[data-r=""]{background:var(--chip);color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:2px}
.hist .h{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hist .h:first-child{border-top:0}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:3px}
.pips i.red{background:var(--red)}.pips i.yellow{background:var(--amber)}.pips i.green{background:var(--green)}
.res-W{color:var(--green);font-weight:700}.res-L{color:var(--red);font-weight:700}
.search{position:relative}
.tc{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.tc b{font-family:var(--display);font-style:italic;font-size:18px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
svg.trend text{fill:var(--muted);font:500 10px var(--mono)}
svg.trend .ln{stroke:var(--accent);fill:none;stroke-width:2}
svg.trend .ar{fill:var(--accent);opacity:.12}
svg.trend .gr{stroke:var(--line)}
svg.trend circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg.trend circle.last{fill:var(--accent)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

function trend(rs){
 const pts=rs.filter(r=>r.opk!==""&&!isNaN(+r.opk)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
 if(pts.length<2)return `<p class="empty">Log OPK from luckystats on two or more sets to see your trend here.</p>`;
 const W=320,H=120,pl=28,pr=10,pt=10,pb=22;const v=pts.map(p=>+p.opk);
 let lo=Math.floor(Math.min(...v)),hi=Math.ceil(Math.max(...v));if(lo===hi){lo--;hi++}
 const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=val=>pt+(hi-val)*(H-pt-pb)/(hi-lo);
 const line=pts.map((p,i)=>`${x(i)},${y(+p.opk)}`).join(" ");
 const mid=(lo+hi)/2;
 return `<svg class="trend" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Openings per kill over recent sets">
  ${[hi,mid,lo].map(t=>`<line class="gr" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${+t.toFixed(1)}</text>`).join("")}
  <polygon class="ar" points="${x(0)},${H-pb} ${line} ${x(pts.length-1)},${H-pb}"/>
  <polyline class="ln" points="${line}"/>
  ${pts.map((p,i)=>`<circle class="${i===pts.length-1?"last":""}" cx="${x(i)}" cy="${y(+p.opk)}" r="3.5"/>`).join("")}
  <text x="${pl}" y="${H-6}">${esc(pts[0].date.slice(5))}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(pts.at(-1).date.slice(5))}</text>
 </svg>`;
}
